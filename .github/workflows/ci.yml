name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, unit tests, build, audit
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      SESSION_SECRET: ci-only-secret-not-used-in-production-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint . --quiet
      - run: npx vitest run
      - run: npx next build
      - name: Dependency audit (production deps, high+ severity)
        run: npm audit --omit=dev --audit-level=high

  isolation:
    name: Tenant isolation test (real DB + running server)
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      SESSION_SECRET: ci-only-secret-not-used-in-production-0123456789
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma db push --skip-generate --accept-data-loss
      - run: npx next build
      - name: Start server and run the isolation test
        run: |
          npx next start -p 3000 &
          for i in $(seq 1 40); do curl -sf http://localhost:3000/api/health && break || sleep 2; done
          BASE_URL=http://localhost:3000 node scripts/isolation-test.mjs
